[package]
name = "tui-snippets"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.3"
anyhow = "1.0"
rpassword = "7.5.4"
aes-gcm = { version = "0.11.0", features = ["aes"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
pulldown-cmark = "0.10"
tui-textarea = "0.4"
chrono = "0.4.45"
evalexpr = "13.1.0"

[[bin]]
name = "snip"
path = "src/bin/snippet.rs"
